# dsh-usage-analytics bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; activate with
# `dsh plugin --profile <name> add link:<path-to-this-package>`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (aggregation over ctx.sessionPersistence + the
# /api/dsh-usage-analytics route family), and the `dsh.client` declaration in
# package.json makes the browser half (exports "./client", served at
# /plugins/usage-analytics/client.js) load in the web GUI.
- insert:
    - id: usage-analytics
      name: 'dsh-usage-analytics'
